[workspace]
members = ["wyrm-types", "tithe", "scale-vault", "mock-dcl", "mock-ft", "mock-nearly"]
resolver = "2"

[workspace.dependencies]
near-sdk = "5.29.1"
near-contract-standards = "5.29.1"
near-workspaces = "0.23.0"
# The node near-workspaces runs; the tests start it themselves to set a long epoch for fast time travel.
near-sandbox = "0.3.16"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
proptest = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
